<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Upload</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      Upload Music Sheet
    </div>

    <div class="card-body">

      <form id="uploadForm">

        <div class="mb-3">
          <label class="form-label">Music Title</label>
          <input type="text" class="form-control" placeholder="Enter title" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Select File</label>
          <input type="file" class="form-control" accept=".pdf,.doc,.docx" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Description (optional)</label>
          <textarea class="form-control" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-success w-100">
          Upload
        </button>

      </form>

      <div class="alert alert-info mt-3 d-none" id="statusBox">
        Uploading...
      </div>

    </div>
  </div>

</div>

<script>
document.getElementById("uploadForm").addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("statusBox").classList.remove("d-none");
});
</script>

</body>
</html>
